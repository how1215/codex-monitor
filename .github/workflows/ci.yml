name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package local app
        run: ./scripts/build-app.sh
      - name: Validate bundle
        run: |
          plutil -lint Support/Info.plist
          codesign --verify --strict --verbose=2 ".build/Codex Monitor.app"
